<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Night Sky -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#161c26"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>

    <!-- Ultramarine Gem Glow -->
    <linearGradient id="lapisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b7a"/>
    </linearGradient>

    <!-- Gold Edge -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Steel Palette Knife Blade -->
    <linearGradient id="knifeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Icon Box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Golden Kintsugi Cracks (Background Detail) -->
  <path d="M 12 16 L 24 28 L 20 38 L 10 46" fill="none" stroke="#eab308" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="1 1"/>
  <path d="M 24 28 L 36 24 L 48 34" fill="none" stroke="#eab308" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Ultramarine Glowing Paint Splatter / Wing Feather Motif -->
  <path d="M 32 8 C 44 14, 54 28, 52 44 C 50 54, 38 58, 28 54 C 18 50, 16 38, 24 28 C 30 20, 31 12, 32 8 Z" 
        fill="url(#lapisGrad)" filter="url(#glow)"/>

  <!-- Core Pure Lapis Gem droplet inside -->
  <ellipse cx="34" cy="38" rx="8" ry="12" transform="rotate(-15 34 38)" fill="#3b82f6" opacity="0.9"/>
  <ellipse cx="32" cy="34" rx="3" ry="5" transform="rotate(-20 32 34)" fill="#ffffff" opacity="0.75"/>

  <!-- Palette Knife (The Inverted Restorer's Blade) -->
  <g transform="rotate(-35 32 32)">
    <!-- Blade -->
    <path d="M 32 10 L 37 26 C 36 34, 34 38, 32 40 C 30 38, 28 34, 27 26 Z" fill="url(#knifeGrad)"/>
    <!-- Blade Ridge Highlight -->
    <path d="M 32 11 L 32 39" stroke="#ffffff" stroke-width="0.75" opacity="0.9"/>
    <!-- Brass Ferrule / Neck -->
    <path d="M 30.5 40 L 33.5 40 L 33 46 L 31 46 Z" fill="url(#goldGrad)"/>
    <!-- Walnut Wooden Handle -->
    <rect x="30" y="46" width="4" height="12" rx="1.5" fill="#78350f"/>
    <rect x="31" y="47" width="2" height="10" rx="0.5" fill="#92400e"/>
  </g>

  <!-- Golden Stardust / Peeling Flakes -->
  <circle cx="16" cy="20" r="1.2" fill="#fde047" opacity="0.9"/>
  <circle cx="48" cy="18" r="1.5" fill="#fde047" opacity="0.8"/>
  <circle cx="50" cy="48" r="1.2" fill="#fde047" opacity="0.85"/>
  <polygon points="44,22 46,24 44,26 42,24" fill="#ffffff" opacity="0.9"/>
</svg>
