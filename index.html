  <style>

      --bg-secondary: #161c26;

    }

    html[data-theme="light"] {
      --bg-primary: #fafbfd;
      --bg-secondary: #f0f3f8;
      --bg-toolbar: rgba(250, 251, 253, 0.94);
      --text-primary: #1e242b;
      --text-secondary: #586370;
      --accent-blue: #1e3fad;
      --accent-gold: #b3861b;
      --border-color: #dce2ec;
    }

    html[data-theme="sepia"] {
      --bg-primary: #f5eedc;
      --bg-secondary: #ebe1c8;
      --bg-toolbar: rgba(245, 238, 220, 0.94);
      --text-primary: #2c2216;
      --text-secondary: #695742;
      --accent-blue: #23408e;

    }

    body {
      background-color: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      font-family: var(--reader-font);
      font-size: var(--reader-font-size);

    /* Fixed Reader Top Bar */

      position: fixed;
      top: 0;

      right: 0;

      background: var(--bg-toolbar);

    }

    .novel-topbar-title {

      display: flex;
      align-items: center;
      gap: 8px;

      overflow: hidden;

    }

    .novel-topbar-controls {

    .ctrl-btn:hover, .ctrl-btn.active {

    }

    /* Language Selector Styling */
    .lang-select {

    /* Hide default Google Translate banner bar */

    }

    /* Sidebar customization */

    .sidebar-toggle {

    /* Main Novel Content Typography */
    .markdown-section {

    .markdown-section h1, .markdown-section h2, .markdown-section h3 {

    .markdown-section h1 {
      font-size: 1.75rem;
      line-height: 1.4;
      border-bottom: 2px solid var(--accent-gold) !important;
      padding-bottom: 14px;
      margin-bottom: 32px;

    .markdown-section p {
      font-size: var(--reader-font-size);
      line-height: var(--reader-line-height);
      letter-spacing: 0.03em;

    .markdown-section hr {
      border: none;

      margin: 2.8em 0;

    .markdown-section hr::after {
      content: "◆　◇　◆";

      font-size: 0.95rem;
      letter-spacing: 0.4em;
    }

    .markdown-section blockquote {
      border-left: 4px solid var(--accent-gold) !important;
      background: var(--bg-secondary);

    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;

    .markdown-section table tr,
    .markdown-section table td,
    .markdown-section table th {
      background-color: var(--bg-secondary) !important;
      border-color: var(--border-color) !important;
      color: var(--text-primary) !important;

    .markdown-section img {
      border-radius: 8px;

    /* Search input styling */

      background: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px;
    }

    /* ========================================================
       TTS (Text-to-Speech) Audio Reader Styling
       ======================================================== */
    .tts-target {
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: -6px;
      margin-right: -6px;
    }

    .tts-target:hover {
      background: rgba(59, 110, 246, 0.08);
    }

    /* Floating play button indicator on hover */
    .tts-target::before {
      content: "▶ 朗読";
      position: absolute;
      left: -64px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent-gold);
      color: #111;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .tts-target:hover::before {
      opacity: 0.95;
      transform: translateY(-50%) translateX(4px);
    }

    /* Active Speaking Paragraph Highlight */
    .tts-speaking {
      background: rgba(212, 175, 55, 0.15) !important;
      border-left: 4px solid var(--accent-gold) !important;
      padding-left: 12px !important;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
      transition: all 0.3s ease;
    }

    /* Fixed Floating Audio Player Bar */
    .tts-player {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      width: calc(100% - 32px);
      max-width: 780px;
      background: var(--bg-toolbar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.2);
      z-index: 9998;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'Noto Sans JP', sans-serif;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      opacity: 0;
      pointer-events: none;
    }

    .tts-player.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .tts-player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tts-player-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .tts-player-badge {
      background: var(--accent-gold);

      font-weight: 700;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .tts-player-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-primary);
      font-style: italic;
    }

    .tts-player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tts-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tts-btn {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .tts-btn:hover {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    .tts-btn-play {
      background: var(--accent-gold);
      color: #111;
      font-weight: 700;
      border-color: var(--accent-gold);
      min-width: 80px;
    }

    .tts-btn-play:hover {
      background: #e6c148;
      color: #000;
      border-color: #e6c148;
    }

    .tts-select {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .tts-target::before {
        display: none; /* スマホではホバーチップ非表示 */
      }
      .tts-player {
        bottom: 8px;
        width: calc(100% - 16px);
        padding: 8px 12px;
      }
      .tts-btn {
        padding: 5px 8px;
        font-size: 12px;
      }
      .tts-player-info {
        font-size: 11px;
      }
    }

    @media (max-width: 768px) {
      .novel-topbar-title span.sub {
        display: none;
      }
      .markdown-section {
        padding: 24px 16px 70px !important;
      }
    }
  </style>

<body>
  <!-- Reader Control & Language Topbar -->
  <header class="novel-topbar notranslate">
    <a href="#/" class="novel-topbar-title">
      <span>🎨 嘘つきパレットと剥落の聖女</span>
      <span class="sub" style="font-size: 11px; color: var(--text-secondary); font-weight: 400;">―異端修復師は神話の塗り潰しを暴く―</span>
    </a>

    <div class="novel-topbar-controls">
      <!-- Language Selector (Worldwide Translation) -->
      <select id="lang-switcher" class="lang-select" aria-label="Language" onchange="switchLanguage(this.value)">
        <option value="ja">🇯🇵 日本語 (Original)</option>
        <option value="en">🇺🇸 English</option>
        <option value="zh-CN">🇨🇳 简体中文</option>
        <option value="zh-TW">🇹🇼 繁體中文</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="pt">🇧🇷 Português</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="id">🇮🇩 Bahasa Indonesia</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
      </select>

      <!-- Theme Switcher -->
      <div class="ctrl-group" title="背景テーマ切替">
        <button class="ctrl-btn active" id="theme-dark" onclick="setTheme('dark')">🌙 濃紺</button>
        <button class="ctrl-btn" id="theme-sepia" onclick="setTheme('sepia')">📜 羊皮紙</button>
        <button class="ctrl-btn" id="theme-light" onclick="setTheme('light')">☀️ 白亜</button>
      </div>

      <!-- Font Family Switcher -->
      <div class="ctrl-group" title="フォント切替">
        <button class="ctrl-btn active" id="font-serif" onclick="setFont('serif')">明朝</button>
        <button class="ctrl-btn" id="font-sans" onclick="setFont('sans')">ゴシック</button>
      </div>

      <!-- Font Size Switcher -->
      <div class="ctrl-group" title="文字サイズ調整">
        <button class="ctrl-btn" onclick="changeFontSize(-1.5)">A-</button>
        <button class="ctrl-btn" onclick="changeFontSize(1.5)">A+</button>
      </div>

      <!-- TTS Audio Reader Toggle Button -->
      <button class="ctrl-btn" id="tts-toggle-btn" style="background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--accent-gold); font-weight: 700;" onclick="toggleTTSPlayer()" title="音声朗読プレイヤーを開く/閉じる">
        🎧 朗読
      </button>
    </div>
  </header>

  <!-- Floating Audio Player Bar -->
  <div id="tts-player" class="tts-player notranslate">
    <div class="tts-player-top">
      <div class="tts-player-info">
        <span class="tts-player-badge">🎙 朗読中</span>
        <span id="tts-status-text" class="tts-player-text">段落をクリックすると、そこから朗読を開始します</span>
      </div>
      <button class="tts-btn" style="padding: 2px 8px; font-size: 11px;" onclick="closeTTSPlayer()" title="プレイヤーを閉じる">✕</button>
    </div>
    <div class="tts-player-controls">
      <div class="tts-btn-group">
        <button class="tts-btn" onclick="ttsPrev()" title="前の段落へ">⏮ 前へ</button>
        <button class="tts-btn tts-btn-play" id="tts-play-btn" onclick="ttsTogglePlay()">▶ 再生</button>
        <button class="tts-btn" onclick="ttsStop()" title="朗読を停止">⏹ 停止</button>
        <button class="tts-btn" onclick="ttsNext()" title="次の段落へ">⏩ 次へ</button>
      </div>
      <div class="tts-btn-group">
        <select id="tts-rate-select" class="tts-select" onchange="ttsSetRate(this.value)" title="朗読速度">
          <option value="0.8">速度: 0.8x</option>
          <option value="1.0" selected>速度: 1.0x</option>
          <option value="1.2">速度: 1.2x</option>
          <option value="1.5">速度: 1.5x</option>
          <option value="1.8">速度: 1.8x</option>
        </select>
        <select id="tts-voice-select" class="tts-select" onchange="ttsSetVoice(this.value)" title="音声選択">
          <option value="">🎙 標準音声</option>
        </select>
      </div>
    </div>
  </div>

  <div id="google_translate_element"></div>
  <div id="app">読み込み中... / Loading Atelier Pentimento...</div>

  <script>
    // Reader Preferences Controller
    let currentFontSize = parseFloat(localStorage.getItem('novel-font-size')) || 17.5;
    document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'px');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('novel-theme', theme);
      ['dark', 'sepia', 'light'].forEach(t => {
        const btn = document.getElementById('theme-' + t);
        if (btn) btn.classList.toggle('active', t === theme);
      });
    }

    function setFont(type) {
      const fontVal = type === 'sans'
        ? "'Noto Sans JP', sans-serif"
        : "'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif";
      document.documentElement.style.setProperty('--reader-font', fontVal);
      localStorage.setItem('novel-font', type);
      document.getElementById('font-serif').classList.toggle('active', type === 'serif');
      document.getElementById('font-sans').classList.toggle('active', type === 'sans');
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(24, Math.max(14, currentFontSize + delta));
      document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'px');
      localStorage.setItem('novel-font-size', currentFontSize);
    }

    // Restore saved settings
    const savedTheme = localStorage.getItem('novel-theme');
    if (savedTheme) setTheme(savedTheme);
    const savedFont = localStorage.getItem('novel-font');
    if (savedFont) setFont(savedFont);

    // Docsify Configuration
    window.$docsify = {
      name: '嘘つきパレットと剥落の聖女',
      repo: 'https://github.com/Marth1113/anime-auto-writing',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 物語・用語を検索...',
        noData: '該当する記述が見つかりません',
        depth: 3
      },
      pagination: {
        previousText: '◀ 前の話へ',
        nextText: '次の話へ ▶',
        crossChapter: true,
        crossChapterText: true,
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            initTTSPage();
          });
        }
      ]
    };

    // ========================================================
    // High-Precision TTS Audio Reader Engine (Web Speech API)
    // ========================================================
    let ttsNodes = [];
    let ttsCurrentIndex = -1;
    let ttsIsPlaying = false;
    let ttsRate = 1.0;
    let ttsVoices = [];
    let ttsSelectedVoice = null;
    let ttsUtterance = null;

    // Load voices
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      ttsVoices = window.speechSynthesis.getVoices();
      const select = document.getElementById('tts-voice-select');
      if (!select) return;
      select.innerHTML = '<option value="">🎙 標準音声</option>';

      // Filter primarily Japanese and English, or all available
      ttsVoices.forEach((voice, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${voice.name} (${voice.lang})`;
        if (voice.lang.includes('ja') || voice.lang.includes('JP')) {
          opt.textContent = `🇯🇵 ${opt.textContent}`;
        }
        select.appendChild(opt);
      });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function toggleTTSPlayer() {
      const player = document.getElementById('tts-player');
      const btn = document.getElementById('tts-toggle-btn');
      player.classList.toggle('active');
      const isActive = player.classList.contains('active');
      if (btn) btn.classList.toggle('active', isActive);
      if (isActive && ttsCurrentIndex === -1 && ttsNodes.length > 0) {
        // Ready status
        updateTTSStatus("朗読したい段落をクリックしてください");
      }
    }

    function closeTTSPlayer() {
      ttsStop();
      const player = document.getElementById('tts-player');
      const btn = document.getElementById('tts-toggle-btn');
      player.classList.remove('active');
      if (btn) btn.classList.remove('active');
    }

    function updateTTSStatus(text) {
      const el = document.getElementById('tts-status-text');
      if (el) el.textContent = text;
    }

    function setTTSPlayButton(playing) {
      ttsIsPlaying = playing;
      const btn = document.getElementById('tts-play-btn');
      if (btn) {
        btn.innerHTML = playing ? '⏸ 一時停止' : '▶ 再生';
        btn.style.background = playing ? 'var(--accent-blue)' : 'var(--accent-gold)';
        btn.style.color = playing ? '#ffffff' : '#111';
      }
    }

    function ttsSetRate(rate) {
      ttsRate = parseFloat(rate) || 1.0;
      if (ttsIsPlaying && ttsCurrentIndex >= 0) {
        // Restart current paragraph with new speed
        ttsPlayNode(ttsCurrentIndex);
      }
    }

    function ttsSetVoice(val) {
      ttsSelectedVoice = val !== "" && ttsVoices[parseInt(val)] ? ttsVoices[parseInt(val)] : null;
      if (ttsIsPlaying && ttsCurrentIndex >= 0) {
        ttsPlayNode(ttsCurrentIndex);
      }
    }

    // Attach click listener to each novel paragraph/heading/quote
    function initTTSPage() {
      ttsStop();
      ttsNodes = [];
      ttsCurrentIndex = -1;

      // Select content nodes inside markdown section
      const content = document.querySelector('.markdown-section');
      if (!content) return;

      const candidates = content.querySelectorAll('p, blockquote, h1, h2, h3, li');
      candidates.forEach((node) => {
        // Ignore empty, image-only, or button-only nodes
        const rawText = node.innerText.trim();
        if (rawText.length < 2 || node.closest('.novel-topbar') || node.closest('.tts-player')) return;

        node.classList.add('tts-target');
        const nodeIndex = ttsNodes.length;
        ttsNodes.push(node);

        node.onclick = (e) => {
          // If clicked directly on an anchor link, don't trigger TTS
          if (e.target.tagName.toLowerCase() === 'a') return;
          e.stopPropagation();
          ttsPlayFrom(nodeIndex);
        };
      });
    }

    function ttsPlayFrom(index) {
      if (!('speechSynthesis' in window)) {
        alert('お使いのブラウザは音声合成（TTS）に対応していません。');
        return;
      }
      const player = document.getElementById('tts-player');
      player.classList.add('active');
      const toggleBtn = document.getElementById('tts-toggle-btn');
      if (toggleBtn) toggleBtn.classList.add('active');

      ttsPlayNode(index);
    }

    function ttsPlayNode(index) {
      if (index < 0 || index >= ttsNodes.length) {
        ttsStop();
        updateTTSStatus("朗読が終了しました");
        return;
      }

      window.speechSynthesis.cancel();

      // Clear previous highlight
      ttsNodes.forEach(n => n.classList.remove('tts-speaking'));

      ttsCurrentIndex = index;
      const targetNode = ttsNodes[index];
      targetNode.classList.add('tts-speaking');

      // Smooth scroll to speaking paragraph
      targetNode.scrollIntoView({ behavior: 'smooth', block: 'center' });

      const text = targetNode.innerText.replace(/[\n\r]+/g, ' ').trim();
      updateTTSStatus(`[${index + 1}/${ttsNodes.length}] ${text}`);

      ttsUtterance = new SpeechSynthesisUtterance(text);
      ttsUtterance.rate = ttsRate;

      // Select voice: user chosen, or automatic Japanese/current language matching
      if (ttsSelectedVoice) {
        ttsUtterance.voice = ttsSelectedVoice;
      } else {
        const jaVoice = ttsVoices.find(v => v.lang.startsWith('ja') || v.lang.includes('JP'));
        if (jaVoice) ttsUtterance.voice = jaVoice;
      }

      ttsUtterance.onstart = () => {
        setTTSPlayButton(true);
      };

      ttsUtterance.onend = () => {
        // Automatically play next node
        if (ttsIsPlaying) {
          ttsPlayNode(ttsCurrentIndex + 1);
        }
      };

      ttsUtterance.onerror = (e) => {
        if (e.error !== 'interrupted' && e.error !== 'canceled') {
          console.warn('TTS Error:', e);
        }
      };

      setTTSPlayButton(true);
      window.speechSynthesis.speak(ttsUtterance);
    }

    function ttsTogglePlay() {
      if (!('speechSynthesis' in window)) return;
      if (ttsIsPlaying) {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
        }
        setTTSPlayButton(false);
      } else {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          setTTSPlayButton(true);
        } else if (ttsCurrentIndex >= 0) {
          ttsPlayNode(ttsCurrentIndex);
        } else if (ttsNodes.length > 0) {
          ttsPlayNode(0);
        }
      }
    }

    function ttsStop() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      setTTSPlayButton(false);
      ttsNodes.forEach(n => n.classList.remove('tts-speaking'));
      ttsCurrentIndex = -1;
      updateTTSStatus("朗読を停止しました");
    }

    function ttsPrev() {
      if (ttsCurrentIndex > 0) {
        ttsPlayNode(ttsCurrentIndex - 1);
      }
    }

    function ttsNext() {
      if (ttsCurrentIndex < ttsNodes.length - 1) {
        ttsPlayNode(ttsCurrentIndex + 1);
      }
    }

    // Stop speaking on route changes
    window.addEventListener('hashchange', () => {
      ttsStop();
    });

    // Worldwide Multilingual Support via Google Translate
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ja',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function switchLanguage(lang) {
      if (lang === 'ja') {
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        location.reload();
        return;
      }
      const combo = document.querySelector('.goog-te-combo');
      if (combo) {
        combo.value = lang;
        combo.dispatchEvent(new Event('change'));
      } else {
        document.cookie = "googtrans=/ja/" + lang + "; path=/;";
        location.reload();
      }
    }
  </script>
