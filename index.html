    /* Main Novel Content Typography */
    .markdown-section {

    /* ========================================================
       TTS (Text-to-Speech) Audio Reader Styling
       ======================================================== */
    .tts-target {
      position: relative;
      cursor: text; /* 自然な文字選択・ドラッグを最優先 */
      transition: background-color 0.2s ease, border-color 0.2s ease;
      border-radius: 4px;
      padding: 2px 6px 2px 28px; /* 左側に再生アイコン用の余白 */
      margin-left: -28px;
    }

    .tts-target:hover {
      background: rgba(59, 110, 246, 0.05);
    }

    /* Left-side play button (完全非表示・カーソル乗下時のみ優雅に出現) */
    .tts-play-handle {
      position: absolute;
      left: 2px;
      top: 50%;
      transform: translateY(-50%) scale(0.85);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--bg-secondary);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease;
      user-select: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .tts-target:hover .tts-play-handle {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) scale(1.08);
      background: var(--accent-gold);
      color: #111;
    }

    @media (max-width: 768px) {
      .tts-play-handle {
        display: none !important; /* スマホでは選択ツールチップのみ機能 */
      }
      .tts-target {
        padding-left: 0 !important;
        margin-left: 0 !important;
      }
    }

    /* Floating selection tooltip */
    #tts-selection-tooltip {
      position: absolute;
      background: var(--accent-gold);
      color: #111;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 10001;
      display: none;
      user-select: none;
      font-family: 'Noto Sans JP', sans-serif;
      transform: translateY(-100%) translateY(-6px);
    }
    #tts-selection-tooltip:hover {
      background: #fef08a;
    }

    /* Active Speaking Paragraph Highlight */
    .tts-speaking {
      background: rgba(212, 175, 55, 0.15) !important;
      border-left: 4px solid var(--accent-gold) !important;
      padding-left: 12px !important;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
      transition: all 0.3s ease;
    }

    /* Fixed Floating Audio Player Bar */
    .tts-player {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      width: calc(100% - 32px);
      max-width: 780px;
      background: var(--bg-toolbar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.2);
      z-index: 9998;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'Noto Sans JP', sans-serif;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      opacity: 0;
      pointer-events: none;
    }

    .tts-player.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .tts-player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tts-player-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .tts-player-badge {
      background: var(--accent-gold);
      color: #111;
      font-weight: 700;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .tts-player-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-primary);
      font-style: italic;
    }

    .tts-player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tts-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tts-btn {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .tts-btn:hover {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    .tts-btn-play {
      background: var(--accent-gold);
      color: #111;
      font-weight: 700;
      border-color: var(--accent-gold);
      min-width: 80px;
    }

    .tts-btn-play:hover {
      background: #e6c148;
      color: #000;
      border-color: #e6c148;
    }

    .tts-select {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .tts-target::before {
        display: none; /* スマホではホバーチップ非表示 */
      }
      .tts-player {
        bottom: 8px;
        width: calc(100% - 16px);
        padding: 8px 12px;
      }
      .tts-btn {
        padding: 5px 8px;
        font-size: 12px;
      }
      .tts-player-info {
        font-size: 11px;
      }
    }

    @media (max-width: 768px) {
      .novel-topbar-title span.sub {
        display: none;
      }
      .markdown-section {
        padding: 24px 16px 70px !important;
      }
    }
  
    /* ========================================================
       Top Page Hero Title & Subtitle Styling (一体感のある組版)
       ======================================================== */
    .novel-hero-block {
      text-align: center;
      margin: 10px auto 26px auto;
    }
    .novel-hero-main {
      font-size: 2.15rem;
      font-weight: 700;
      color: var(--accent-gold) !important;
      font-family: var(--reader-font);
      letter-spacing: 0.05em;
      line-height: 1.25;
      margin: 0 0 6px 0;
    }
    .novel-hero-sub {
      font-size: 1.12rem;
      font-weight: 500;
      color: var(--text-primary) !important;
      letter-spacing: 0.08em;
      margin: 0 0 4px 0;
      opacity: 0.92;
    }
    .novel-hero-en {
      font-size: 0.88rem;
      font-family: 'Cinzel', serif;
      font-style: italic;
      color: var(--text-secondary) !important;
      letter-spacing: 0.12em;
      margin: 0 0 20px 0;
    }
    .novel-hero-catch {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent-gold) !important;
      margin: 18px 0 14px 0;
      letter-spacing: 0.04em;
    }
    .novel-hero-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 12px 0 20px 0;
    }

    /* Table & Character Card Styling */
    .markdown-section table {
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      margin: 24px 0 !important;
    }
    .markdown-section table tr:nth-child(even) {
      background-color: var(--table-stripe) !important;
    }
    .markdown-section table th {
      background-color: var(--bg-secondary) !important;
      color: var(--accent-gold) !important;
      font-weight: 700 !important;
      border-bottom: 2px solid var(--border-color) !important;
      padding: 10px 14px !important;
    }
    .markdown-section table td {
      border-bottom: 1px solid var(--border-color) !important;
      padding: 12px 14px !important;
      line-height: 1.6 !important;
    }

    @media (max-width: 600px) {
      .novel-hero-main {
        font-size: 1.6rem !important;
      }
      .novel-hero-sub {
        font-size: 0.98rem !important;
      }
      .novel-hero-catch {
        font-size: 1.0rem !important;
      }

        padding: 8px 10px !important;
        font-size: 13.5px !important;
      }
    }

  </style>
</head>
<body>
  <!-- Reader Control & Language Topbar -->
  <header class="novel-topbar notranslate">
    <a href="#/" class="novel-topbar-title">
      <span>嘘つきパレット<span class="desktop-only">と剥落の聖女</span></span>
      <span class="sub desktop-only" style="font-size: 11px; color: var(--text-secondary); font-weight: 400;">―異端修復師は神話の塗り潰しを暴く―</span>
    </a>

    <div class="novel-topbar-controls">
      <!-- TTS Audio Reader Toggle Button -->
      <button class="ctrl-btn tts-top-btn" id="tts-toggle-btn" onclick="toggleTTSPlayer()" title="音声朗読プレイヤーを開く/閉じる">
        朗読
      </button>

      <!-- Language Selector (Worldwide Translation) -->
      <select id="lang-switcher" class="lang-select" aria-label="Language" onchange="switchLanguage(this.value)">
        <option value="ja">🇯🇵 JP</option>
        <option value="en">🇺🇸 EN</option>
        <option value="zh-CN">🇨🇳 中文</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="es">🇪🇸 ES</option>
        <option value="de">🇩🇪 DE</option>
        <option value="it">🇮🇹 IT</option>
        <option value="pt">🇧🇷 PT</option>
        <option value="ru">🇷🇺 RU</option>
        <option value="id">🇮🇩 ID</option>
        <option value="vi">🇻🇳 VI</option>
      </select>

      <!-- Settings Dropdown Toggle Button -->
      <button class="ctrl-btn settings-toggle-btn" id="settings-toggle-btn" onclick="toggleSettingsDropdown()" title="表示設定（色・フォント・サイズ）">
        表示設定
      </button>
    </div>

    <!-- Dropdown Panel for Reader Settings (Theme, Font, Font Size) -->
    <div id="reader-settings-panel" class="reader-settings-panel">
      <div class="settings-row">
        <span class="settings-label">背景色</span>
        <div class="ctrl-group">
          <button class="ctrl-btn active" id="theme-dark" onclick="setTheme('dark')">濃紺</button>
          <button class="ctrl-btn" id="theme-sepia" onclick="setTheme('sepia')">羊皮紙</button>
          <button class="ctrl-btn" id="theme-light" onclick="setTheme('light')">白亜</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">書体</span>
        <div class="ctrl-group">
          <button class="ctrl-btn active" id="font-serif" onclick="setFont('serif')">明朝体</button>
          <button class="ctrl-btn" id="font-sans" onclick="setFont('sans')">ゴシック</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">文字サイズ</span>
        <div class="ctrl-group">
          <button class="ctrl-btn" onclick="changeFontSize(-1.5)">A- 縮小</button>
          <button class="ctrl-btn" onclick="changeFontSize(1.5)">A+ 拡大</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Floating Audio Player Bar -->
  <div id="tts-player" class="tts-player notranslate">
    <div class="tts-player-top">
      <div class="tts-player-info">
        <span class="tts-player-badge">朗読中</span>
        <span id="tts-status-text" class="tts-player-text">段落をクリックすると、そこから朗読を開始します</span>
      </div>
      <button class="tts-btn" style="padding: 2px 8px; font-size: 11px;" onclick="closeTTSPlayer()" title="プレイヤーを閉じる">✕</button>
    </div>
    <div class="tts-player-controls">
      <div class="tts-btn-group">
        <button class="tts-btn" onclick="ttsPrev()" title="前の段落へ">⏮ 前へ</button>
        <button class="tts-btn tts-btn-play" id="tts-play-btn" onclick="ttsTogglePlay()">▶ 再生</button>
        <button class="tts-btn" onclick="ttsStop()" title="朗読を停止">⏹ 停止</button>
        <button class="tts-btn" onclick="ttsNext()" title="次の段落へ">⏩ 次へ</button>
      </div>
      <div class="tts-btn-group">
        <select id="tts-rate-select" class="tts-select" onchange="ttsSetRate(this.value)" title="朗読速度">
          <option value="0.8">速度: 0.8x</option>
          <option value="1.0" selected>速度: 1.0x</option>
          <option value="1.2">速度: 1.2x</option>
          <option value="1.5">速度: 1.5x</option>
          <option value="1.8">速度: 1.8x</option>
        </select>
        <select id="tts-voice-select" class="tts-select" onchange="ttsSetVoice(this.value)" title="音声選択">
          <option value="">🎙 標準音声</option>
        </select>
      </div>
    </div>
  </div>

  <div id="google_translate_element"></div>
  <div id="app">読み込み中... / Loading Atelier Pentimento...</div>

  <script>
    // Reader Preferences Controller
    function toggleSettingsDropdown() {
      const panel = document.getElementById('reader-settings-panel');
      const btn = document.getElementById('settings-toggle-btn');
      panel.classList.toggle('active');
      btn.classList.toggle('active', panel.classList.contains('active'));
    }

    document.addEventListener('click', (e) => {
      const panel = document.getElementById('reader-settings-panel');
      const btn = document.getElementById('settings-toggle-btn');
      if (panel && btn && panel.classList.contains('active')) {
        if (!panel.contains(e.target) && !btn.contains(e.target)) {
          panel.classList.remove('active');
          btn.classList.remove('active');
        }
      }
    });
    let currentFontSize = parseFloat(localStorage.getItem('novel-font-size')) || 17.5;
    document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'px');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('novel-theme', theme);
      ['dark', 'sepia', 'light'].forEach(t => {
        const btn = document.getElementById('theme-' + t);
        if (btn) btn.classList.toggle('active', t === theme);
      });
    }

    function setFont(type) {
      const fontVal = type === 'sans'
        ? "'Noto Sans JP', sans-serif"
        : "'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif";
      document.documentElement.style.setProperty('--reader-font', fontVal);
      localStorage.setItem('novel-font', type);
      document.getElementById('font-serif').classList.toggle('active', type === 'serif');
      document.getElementById('font-sans').classList.toggle('active', type === 'sans');
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(24, Math.max(14, currentFontSize + delta));
      document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'px');
      localStorage.setItem('novel-font-size', currentFontSize);
    }

    // Restore saved settings
    const savedTheme = localStorage.getItem('novel-theme');
    if (savedTheme) setTheme(savedTheme);
    const savedFont = localStorage.getItem('novel-font');
    if (savedFont) setFont(savedFont);

    // Docsify Configuration
    window.$docsify = {
      name: '嘘つきパレットと剥落の聖女',
      repo: 'https://github.com/Marth1113/anime-auto-writing',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 物語・用語を検索...',
        noData: '該当する記述が見つかりません',
        depth: 3
      },
      pagination: {
        previousText: '◀ 前の話へ',
        nextText: '次の話へ ▶',
        crossChapter: true,
        crossChapterText: true,
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            initTTSPage();
            trackVirtualPageview();
          });
        }
      ]
    };

    // ========================================================
    // High-Precision TTS Audio Reader Engine (Web Speech API)
    // ========================================================
    let ttsNodes = [];
    let ttsCurrentIndex = -1;
    let ttsIsPlaying = false;
    let ttsRate = 1.0;
    let ttsVoices = [];
    let ttsSelectedVoice = null;
    let ttsUtterance = null;

    // Load voices
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      ttsVoices = window.speechSynthesis.getVoices();
      const select = document.getElementById('tts-voice-select');
      if (!select) return;
      select.innerHTML = '<option value="">🎙 標準音声</option>';

      // Filter primarily Japanese and English, or all available
      ttsVoices.forEach((voice, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${voice.name} (${voice.lang})`;
        if (voice.lang.includes('ja') || voice.lang.includes('JP')) {
          opt.textContent = `🇯🇵 ${opt.textContent}`;
        }
        select.appendChild(opt);
      });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function toggleTTSPlayer() {
      const player = document.getElementById('tts-player');
      const btn = document.getElementById('tts-toggle-btn');
      player.classList.toggle('active');
      const isActive = player.classList.contains('active');
      if (btn) btn.classList.toggle('active', isActive);
      if (isActive && ttsCurrentIndex === -1 && ttsNodes.length > 0) {
        // Ready status
        updateTTSStatus("朗読したい段落をクリックしてください");
      }
    }

    function closeTTSPlayer() {
      ttsStop();
      const player = document.getElementById('tts-player');
      const btn = document.getElementById('tts-toggle-btn');
      player.classList.remove('active');
      if (btn) btn.classList.remove('active');
    }

    function updateTTSStatus(text) {
      const el = document.getElementById('tts-status-text');
      if (el) el.textContent = text;
    }

    function setTTSPlayButton(playing) {
      ttsIsPlaying = playing;
      const btn = document.getElementById('tts-play-btn');
      if (btn) {
        btn.innerHTML = playing ? '⏸ 一時停止' : '▶ 再生';
        btn.style.background = playing ? 'var(--accent-blue)' : 'var(--accent-gold)';
        btn.style.color = playing ? '#ffffff' : '#111';
      }
    }

    function ttsSetRate(rate) {
      ttsRate = parseFloat(rate) || 1.0;
      if (ttsIsPlaying && ttsCurrentIndex >= 0) {
        // Restart current paragraph with new speed
        ttsPlayNode(ttsCurrentIndex);
      }
    }

    function ttsSetVoice(val) {
      ttsSelectedVoice = val !== "" && ttsVoices[parseInt(val)] ? ttsVoices[parseInt(val)] : null;
      if (ttsIsPlaying && ttsCurrentIndex >= 0) {
        ttsPlayNode(ttsCurrentIndex);
      }
    }

    // Attach play handle & selection listener to each novel paragraph/heading/quote
    function initTTSPage() {
      ttsStop();
      ttsNodes = [];
      ttsCurrentIndex = -1;

      const content = document.querySelector('.markdown-section');
      if (!content) return;

      // Remove existing tooltip if any
      let tooltip = document.getElementById('tts-selection-tooltip');
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.id = 'tts-selection-tooltip';
        tooltip.textContent = '▶ ここから朗読';
        document.body.appendChild(tooltip);
      }
      tooltip.style.display = 'none';

      // Tooltip click
      tooltip.onmousedown = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (selectedNodeIndex >= 0) {
          ttsPlayFrom(selectedNodeIndex);
        }
        tooltip.style.display = 'none';
      };

      let selectedNodeIndex = -1;

      const candidates = content.querySelectorAll('p, blockquote, h1, h2, h3, li');
      candidates.forEach((node) => {
        const rawText = node.innerText.trim();
        if (rawText.length < 2 || node.closest('.novel-topbar') || node.closest('.tts-player')) return;

        node.classList.add('tts-target');
        const nodeIndex = ttsNodes.length;
        ttsNodes.push(node);

        // Add dedicated play handle button
        let handle = node.querySelector('.tts-play-handle');
        if (!handle) {
          handle = document.createElement('span');
          handle.className = 'tts-play-handle';
          handle.textContent = '▶';
          handle.title = 'ここから朗読を開始';
          node.insertBefore(handle, node.firstChild);
        }

        // Handle click exclusively starts TTS
        handle.onclick = (e) => {
          e.stopPropagation();
          ttsPlayFrom(nodeIndex);
        };

        // Text selection detection
        node.onmouseup = (e) => {
          const selection = window.getSelection();
          const selectedText = selection.toString().trim();
          if (selectedText.length > 0) {
            selectedNodeIndex = nodeIndex;
            const range = selection.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            tooltip.style.left = (rect.left + window.scrollX + rect.width / 2 - 45) + 'px';
            tooltip.style.top = (rect.top + window.scrollY) + 'px';
            tooltip.style.display = 'block';
          } else {
            tooltip.style.display = 'none';
          }
        };
      });

      // Hide tooltip when clicking anywhere else
      document.addEventListener('mousedown', (e) => {
        if (e.target !== tooltip) {
          tooltip.style.display = 'none';
        }
      });
    }

    function ttsPlayFrom(index) {
      if (!('speechSynthesis' in window)) {
        alert('お使いのブラウザは音声合成（TTS）に対応していません。');
        return;
      }
      if (window.dataLayer) {
        window.dataLayer.push({
          event: 'tts_start',
          chapter: location.hash || '/README.md',
          paragraph_index: index
        });
      }
      const player = document.getElementById('tts-player');
      player.classList.add('active');
      const toggleBtn = document.getElementById('tts-toggle-btn');
      if (toggleBtn) toggleBtn.classList.add('active');

      ttsPlayNode(index);
    }

    function ttsPlayNode(index) {
      if (index < 0 || index >= ttsNodes.length) {
        ttsStop();
        updateTTSStatus("朗読が終了しました");
        return;
      }

      window.speechSynthesis.cancel();

      // Clear previous highlight
      ttsNodes.forEach(n => n.classList.remove('tts-speaking'));

      ttsCurrentIndex = index;
      const targetNode = ttsNodes[index];
      targetNode.classList.add('tts-speaking');

      // Smooth scroll to speaking paragraph
      targetNode.scrollIntoView({ behavior: 'smooth', block: 'center' });

      const text = targetNode.innerText.replace(/[\n\r]+/g, ' ').trim();
      updateTTSStatus(`[${index + 1}/${ttsNodes.length}] ${text}`);

      ttsUtterance = new SpeechSynthesisUtterance(text);
      ttsUtterance.rate = ttsRate;

      // Select voice: user chosen, or automatic Japanese/current language matching
      if (ttsSelectedVoice) {
        ttsUtterance.voice = ttsSelectedVoice;
      } else {
        const jaVoice = ttsVoices.find(v => v.lang.startsWith('ja') || v.lang.includes('JP'));
        if (jaVoice) ttsUtterance.voice = jaVoice;
      }

      ttsUtterance.onstart = () => {
        setTTSPlayButton(true);
      };

      ttsUtterance.onend = () => {
        // Automatically play next node
        if (ttsIsPlaying) {
          ttsPlayNode(ttsCurrentIndex + 1);
        }
      };

      ttsUtterance.onerror = (e) => {
        if (e.error !== 'interrupted' && e.error !== 'canceled') {
          console.warn('TTS Error:', e);
        }
      };

      setTTSPlayButton(true);
      window.speechSynthesis.speak(ttsUtterance);
    }

    function ttsTogglePlay() {
      if (!('speechSynthesis' in window)) return;
      if (ttsIsPlaying) {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
        }
        setTTSPlayButton(false);
      } else {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          setTTSPlayButton(true);
        } else if (ttsCurrentIndex >= 0) {
          ttsPlayNode(ttsCurrentIndex);
        } else if (ttsNodes.length > 0) {
          ttsPlayNode(0);
        }
      }
    }

    function ttsStop() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      setTTSPlayButton(false);
      ttsNodes.forEach(n => n.classList.remove('tts-speaking'));
      ttsCurrentIndex = -1;
      updateTTSStatus("朗読を停止しました");
    }

    function ttsPrev() {
      if (ttsCurrentIndex > 0) {
        ttsPlayNode(ttsCurrentIndex - 1);
      }
    }

    function ttsNext() {
      if (ttsCurrentIndex < ttsNodes.length - 1) {
        ttsPlayNode(ttsCurrentIndex + 1);
      }
    }

    // Stop speaking on route changes
    window.addEventListener('hashchange', () => {
      ttsStop();
    });

    // SPA Analytics Tracker (GA4 & GTM)
    let readingCompletedTracked = false;
    function trackVirtualPageview() {
      const pagePath = location.hash.replace(/^#/, '') || '/';
      const pageTitle = document.title;
      readingCompletedTracked = false;

      if (window.dataLayer) {
        window.dataLayer.push({
          event: 'virtual_page_view',
          page_location: location.href,
          page_path: pagePath,
          page_title: pageTitle
        });
      }
      if (typeof gtag === 'function' && window.GA_MEASUREMENT_ID) {
        gtag('event', 'page_view', {
          page_location: location.href,
          page_path: pagePath,
          page_title: pageTitle
        });
      }
    }

    // Scroll Depth / Reading Completion (88%)
    window.addEventListener('scroll', () => {
      if (readingCompletedTracked) return;
      const scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
      if (scrollTotal > 300 && (window.scrollY / scrollTotal) >= 0.88) {
        readingCompletedTracked = true;
        if (window.dataLayer) {
          window.dataLayer.push({
            event: 'chapter_read_complete',
            chapter: location.hash || '/README.md'
          });
        }
      }
    });

    // Worldwide Multilingual Support via Google Translate
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ja',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function switchLanguage(lang) {
      if (window.dataLayer) {
        window.dataLayer.push({
          event: 'language_switch',
          target_lang: lang
        });
      }
      if (lang === 'ja') {
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        location.reload();
        return;
      }
      const combo = document.querySelector('.goog-te-combo');
      if (combo) {
        combo.value = lang;
        combo.dispatchEvent(new Event('change'));
      } else {
        document.cookie = "googtrans=/ja/" + lang + "; path=/;";
        location.reload();
      }
    }
  </script>
